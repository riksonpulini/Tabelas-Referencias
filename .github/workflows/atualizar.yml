name: Atualizar tabelas de referência

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler as fontes e atualizar o JSON
        run: python atualizar.py
      - name: Salvar se algo mudou
        run: |
          git config user.name "atualizador-tabelas"
          git config user.email "atualizador@users.noreply.github.com"
          git add tabelas.json
          git diff --cached --quiet || (git commit -m "Atualização automática dos meses de referência" && git push)
